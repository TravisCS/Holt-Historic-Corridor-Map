<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holt Historic Corridor Map</title>
<meta name="description" content="The Holt Boulevard corridor as a set of tabbed maps: the whole corridor, the hotel district at ONT and the Convention Center, downtown Ontario, downtown Pomona, Fairplex, and the rail link to Las Vegas. Each tab keeps its view while you switch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8862a'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Tab bar for the corridor sections, in the same shape as West Coast Broadband Maps. Each section is the same map page started on that section; frames that are not in front stay loaded (hidden, not removed), so each tab keeps its own view, layers and open cards. */
:root{--bar:#141816;--ink:#ebeee9;--muted:#a8b0ab;--rule:#38403b;--on:#8cc3dc;--serif:"Times New Roman",Times,"Liberation Serif",serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bar);font-family:var(--serif)}
nav{position:fixed;top:0;left:0;right:0;height:calc(40px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;display:flex;align-items:stretch;gap:2px;background:var(--bar);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;z-index:2}
nav::-webkit-scrollbar{display:none}
nav button{font-family:var(--serif);font-size:15px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:0 14px;white-space:nowrap;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--on);font-weight:bold}
nav .by{margin-left:auto;align-self:center;color:var(--muted);font-size:13px;padding:0 12px;white-space:nowrap}
#frames{position:fixed;left:0;right:0;bottom:0;top:calc(40px + env(safe-area-inset-top,0px))}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden}
#frames iframe.on{visibility:visible}
@media (max-width:1280px){nav button{padding:0 10px;font-size:14px}}@media (max-width:640px){nav .by{display:none}nav button{padding:0 8px}}
</style>
</head>
<body>
<nav role="tablist" aria-label="Corridor sections" id="tabs"><span class="by">Maps by T. C. Smith</span></nav>
<div id="frames"></div>
<script>
"use strict";
// To add a section: add a row here and a matching entry in ZOOMS and SEC in map.html. Order is tab order.
var V="20261103b";
var TABS=[
  {id:"all",label:"Everything (whole corridor)",short:"All"},
  {id:"hotels",label:"Hotel district (ONT and Convention Center)",short:"Hotel district"},
  {id:"ontario",label:"Downtown Ontario",short:"Ontario"},
  {id:"pomona",label:"Downtown Pomona",short:"Pomona"},
  {id:"fairplex",label:"Fairplex",short:"Fairplex"},
  {id:"rail",label:"Rail: Las Vegas to Pomona",short:"Rail"}
];
var KEY="holt-tabs-active",nav=document.getElementById("tabs"),box=document.getElementById("frames"),frames={},btns={};
var mq=window.matchMedia("(max-width:1280px)");
TABS.forEach(function(t){
  var b=document.createElement("button");b.setAttribute("role","tab");b.id="tab-"+t.id;b.textContent=mq.matches?t.short:t.label;
  b.setAttribute("aria-selected","false");b.onclick=function(){show(t.id)};
  nav.insertBefore(b,nav.querySelector(".by"));btns[t.id]=b;
});
function relabel(){TABS.forEach(function(t){btns[t.id].textContent=mq.matches?t.short:t.label})}
if(mq.addEventListener)mq.addEventListener("change",relabel);else if(mq.addListener)mq.addListener(relabel);
function show(id){
  var t=TABS.filter(function(x){return x.id===id})[0]||TABS[0];
  if(!frames[t.id]){var f=document.createElement("iframe");f.title=t.label;f.src="map.html?v="+V+"#"+t.id;f.setAttribute("allow","fullscreen; geolocation; clipboard-write; web-share");box.appendChild(f);frames[t.id]=f}
  for(var k in frames)frames[k].classList.toggle("on",k===t.id);
  for(var k2 in btns)btns[k2].setAttribute("aria-selected",String(k2===t.id));
  try{localStorage.setItem(KEY,t.id)}catch(e){}
  if(location.hash!=="#"+t.id)history.replaceState(null,"","#"+t.id);
}
var start=location.hash.slice(1);
if(!start){try{start=localStorage.getItem(KEY)}catch(e){}}
show(start||"all");
window.addEventListener("hashchange",function(){show(location.hash.slice(1))});
</script>
</body>
</html>
